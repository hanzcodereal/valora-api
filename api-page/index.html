<script>
    function updateYoutubeQualityOptions(catIndex, endpointIndex) {
        const typeSelect = document.getElementById(`yt-type-${catIndex}-${endpointIndex}`);
        const qualitySelect = document.getElementById(`yt-quality-${catIndex}-${endpointIndex}`);
        const type = typeSelect.value;

        const optionsByType = {
            video: ['1080P', '720P', '480P', '360P', '240P', '144P'],
            audio: ['320KBPS', '256KBPS', '192KBPS', '128KBPS', '64KBPS']
        };

        const options = optionsByType[type] || optionsByType.video;
        qualitySelect.innerHTML = options
            .map((q, i) => `<option value="${q}" ${i === 1 ? 'selected' : ''}>${q}</option>`)
            .join('');
    }

    function toggleCategory(index) {
        const category = document.getElementById(`category-${index}`);
        const icon = document.getElementById(`category-icon-${index}`);
        if (category.classList.contains('hidden')) {
            category.classList.remove('hidden');
            icon.textContent = 'expand_less';
        } else {
            category.classList.add('hidden');
            icon.textContent = 'expand_more';
        }
    }

    function toggleEndpoint(catIndex, endpointIndex) {
        const endpoint = document.getElementById(`endpoint-${catIndex}-${endpointIndex}`);
        const icon = document.getElementById(`endpoint-icon-${catIndex}-${endpointIndex}`);
        if (endpoint.classList.contains('hidden')) {
            endpoint.classList.remove('hidden');
            icon.textContent = 'expand_less';
        } else {
            endpoint.classList.add('hidden');
            icon.textContent = 'expand_more';
        }
    }

    const responseMediaStore = {};

    const HTTP_STATUS_MAP = {
        200: 'OK — Request successful',
        400: 'Bad Request — Invalid parameters',
        401: 'Unauthorized — Invalid or missing API key',
        403: 'Forbidden — Access denied',
        404: 'Not Found — Resource not found',
        429: 'Too Many Requests — Rate limit exceeded',
        500: 'Internal Server Error — Server error'
    };

    function getStatusDescription(code) {
        if (HTTP_STATUS_MAP[code]) return HTTP_STATUS_MAP[code];
        if (code >= 200 && code < 300) return 'Success';
        if (code >= 300 && code < 400) return 'Redirection';
        if (code >= 400 && code < 500) return 'Client Error';
        if (code >= 500) return 'Server Error';
        return 'Unknown Status';
    }

    function setStatusTable(codeEl, descEl, code) {
        const isSuccess = code >= 200 && code < 300;
        const colorClass = isSuccess ? 'text-green-400' : 'text-red-400';
        codeEl.textContent = code;
        codeEl.className = `px-2 py-1 border border-gray-700 font-bold bg-gray-900 ${colorClass}`;
        descEl.textContent = getStatusDescription(code);
        descEl.className = `px-2 py-1 border border-gray-700 bg-gray-900 ${colorClass}`;
    }

    function copyText(elementId, btnEl) {
        const el = document.getElementById(elementId);
        if (!el) return;
        const text = el.textContent;
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => {
            const original = btnEl.dataset.label || btnEl.textContent;
            btnEl.dataset.label = original;
            btnEl.textContent = '✓ Copied';
            btnEl.classList.add('text-green-400', 'border-green-500');
            setTimeout(() => {
                btnEl.textContent = original;
                btnEl.classList.remove('text-green-400', 'border-green-500');
            }, 2000);
        }).catch(() => {});
    }

    function downloadResponse(catIndex, endpointIndex) {
        const media = responseMediaStore[`${catIndex}-${endpointIndex}`];
        if (!media) return;
        const a = document.createElement('a');
        a.href = media.url;
        a.download = media.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    async function executeRequest(event, catIndex, endpointIndex, method, path, produces) {
        event.preventDefault();
        const form = document.getElementById(`form-${catIndex}-${endpointIndex}`);
        const responseDiv = document.getElementById(`response-${catIndex}-${endpointIndex}`);
        const responseContent = document.getElementById(`response-content-${catIndex}-${endpointIndex}`);
        const clearButton = document.getElementById(`clear-${catIndex}-${endpointIndex}`);
        const statusCodeCell = document.getElementById(`response-status-code-${catIndex}-${endpointIndex}`);
        const statusDescCell = document.getElementById(`response-status-desc-${catIndex}-${endpointIndex}`);
        const timeValue = document.getElementById(`response-time-value-${catIndex}-${endpointIndex}`);
        const urlCode = document.getElementById(`response-url-${catIndex}-${endpointIndex}`);
        const curlCode = document.getElementById(`response-curl-${catIndex}-${endpointIndex}`);
        const downloadBtn = document.getElementById(`download-btn-${catIndex}-${endpointIndex}`);
        const copyResponseBtn = document.getElementById(`copy-response-btn-${catIndex}-${endpointIndex}`);

        const formData = new FormData(form);
        const params = new URLSearchParams();
        for (const [key, value] of formData.entries()) {
            if (value) {
                params.append(key, value);
            }
        }

        const fullPath = `${path}?${params.toString()}`;
        const fullUrl = `${window.location.origin}${fullPath}`;
        const curlCmd = `curl -X ${method} "${fullUrl}"`;

        responseDiv.classList.remove('hidden');
        responseContent.innerHTML = '<div class="loader"></div>';
        statusCodeCell.textContent = '...';
        statusCodeCell.className = 'px-2 py-1 border border-gray-700 font-bold bg-gray-900 text-slate-400';
        statusDescCell.textContent = 'Waiting for response...';
        statusDescCell.className = 'px-2 py-1 border border-gray-700 bg-gray-900 text-slate-400';
        timeValue.textContent = '';
        urlCode.textContent = fullUrl;
        curlCode.textContent = curlCmd;
        downloadBtn.classList.add('hidden');
        copyResponseBtn.classList.add('hidden');

        const mediaKey = `${catIndex}-${endpointIndex}`;
        if (responseMediaStore[mediaKey]) {
            URL.revokeObjectURL(responseMediaStore[mediaKey].url);
            delete responseMediaStore[mediaKey];
        }

        const tStart = performance.now();
        try {
            const response = await fetch(fullPath);
            const latency = (performance.now() - tStart).toFixed(0);
            timeValue.textContent = `${latency} ms`;

            setStatusTable(statusCodeCell, statusDescCell, response.status);

            const contentType = response.headers.get("content-type") || '';

            if (contentType.includes("application/json")) {
                const data = await response.json();
                responseContent.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                copyResponseBtn.classList.remove('hidden');
            } else if (contentType.startsWith("image/") || contentType.startsWith("video/") || contentType.startsWith("audio/")) {
                const blob = await response.blob();
                const mediaUrl = URL.createObjectURL(blob);
                const subtype = (contentType.split('/')[1] || 'bin').split(';')[0];
                const filename = `response-${catIndex}-${endpointIndex}.${subtype}`;

                if (contentType.startsWith("image/")) {
                    responseContent.innerHTML = `<img src="${mediaUrl}" class="max-w-full h-auto rounded-md">`;
                } else if (contentType.startsWith("video/")) {
                    responseContent.innerHTML = `<video src="${mediaUrl}" controls class="max-w-full h-auto rounded-md"></video>`;
                } else {
                    responseContent.innerHTML = `<audio src="${mediaUrl}" controls class="w-full"></audio>`;
                }

                responseMediaStore[mediaKey] = { url: mediaUrl, filename };
                downloadBtn.classList.remove('hidden');
            } else {
                const text = await response.text();
                responseContent.innerHTML = `<pre>${text}</pre>`;
                copyResponseBtn.classList.remove('hidden');
            }
        } catch (error) {
            const latency = (performance.now() - tStart).toFixed(0);
            timeValue.textContent = `${latency} ms`;
            statusCodeCell.textContent = 'ERR';
            statusCodeCell.className = 'px-2 py-1 border border-gray-700 font-bold bg-gray-900 text-red-400';
            statusDescCell.textContent = 'Network Error — Request failed';
            statusDescCell.className = 'px-2 py-1 border border-gray-700 bg-gray-900 text-red-400';
            responseContent.innerHTML = `<pre>${error}</pre>`;
            copyResponseBtn.classList.remove('hidden');
        }
        clearButton.classList.remove('hidden');
    }

    function clearResponse(catIndex, endpointIndex) {
        const responseDiv = document.getElementById(`response-${catIndex}-${endpointIndex}`);
        const responseContent = document.getElementById(`response-content-${catIndex}-${endpointIndex}`);
        const clearButton = document.getElementById(`clear-${catIndex}-${endpointIndex}`);
        const statusCodeCell = document.getElementById(`response-status-code-${catIndex}-${endpointIndex}`);
        const statusDescCell = document.getElementById(`response-status-desc-${catIndex}-${endpointIndex}`);
        const timeValue = document.getElementById(`response-time-value-${catIndex}-${endpointIndex}`);
        const urlCode = document.getElementById(`response-url-${catIndex}-${endpointIndex}`);
        const curlCode = document.getElementById(`response-curl-${catIndex}-${endpointIndex}`);
        const downloadBtn = document.getElementById(`download-btn-${catIndex}-${endpointIndex}`);

        const mediaKey = `${catIndex}-${endpointIndex}`;
        if (responseMediaStore[mediaKey]) {
            URL.revokeObjectURL(responseMediaStore[mediaKey].url);
            delete responseMediaStore[mediaKey];
        }

        responseContent.innerHTML = '';
        statusCodeCell.textContent = '';
        statusCodeCell.className = 'px-2 py-1 border border-gray-700 font-bold bg-gray-900';
        statusDescCell.textContent = '';
        statusDescCell.className = 'px-2 py-1 border border-gray-700 bg-gray-900';
        timeValue.textContent = '';
        urlCode.textContent = '';
        curlCode.textContent = '';
        downloadBtn.classList.add('hidden');
        responseDiv.classList.add('hidden');
        clearButton.classList.add('hidden');
    }

    async function loadApis() {
        const apiList = document.getElementById('apiList');
        try {
            const response = await fetch('/assets/settings.json');
            const data = await response.json();

            let html = '';
            data.categories.forEach((category, catIndex) => {
                html += `
                <div class="category-group" data-category="${category.name}">
                    <div class="mb-2">
                        <div class="bg-gray-800 border border-gray-700">
                            <button onclick="toggleCategory(${catIndex})" class="w-full px-4 py-3 text-left flex items-center justify-between hover:bg-gray-700 transition-colors duration-150">
                                <h2 class="font-bold flex items-center">
                                    <span class="material-icons text-lg mr-3 text-gray-400">folder</span>
                                    <span class="truncate max-w-xs text-sm">${category.name}</span>
                                    <span class="ml-2 text-xs text-gray-500">(${category.items.length})</span>
                                </h2>
                                <span class="material-icons transition-transform duration-150" id="category-icon-${catIndex}">expand_more</span>
                            </button>

                            <div id="category-${catIndex}" class="hidden">`;

                category.items.forEach((item, endpointIndex) => {
                    const method = 'GET';
                    const pathParts = item.path.split('?');
                    const path = pathParts[0];
                    const queryParams = new URLSearchParams(pathParts[1] || '');

                    const statusClasses = {
                        'ready': 'bg-green-500/20 text-green-400',
                        'update': 'bg-yellow-500/20 text-yellow-400',
                        'error': 'bg-red-500/20 text-red-400'
                    };
                    const statusClass = statusClasses[item.status] || 'bg-gray-600';

                    html += `
                                <div class="border-t border-gray-700 api-item"
                                     data-method="${method}"
                                     data-path="${path}"
                                     data-alias="${item.name}"
                                     data-description="${item.desc}"
                                     data-category="${category.name}">
                                    <button onclick="toggleEndpoint(${catIndex}, ${endpointIndex})" class="w-full px-4 py-3 text-left flex items-center justify-between hover:bg-gray-700 transition-colors duration-150">
                                        <div class="flex items-center min-w-0 flex-1">
                                            <span class="inline-block px-3 py-1 text-xs font-semibold text-white mr-3 flex-shrink-0 bg-gray-600">
                                                ${method}
                                            </span>
                                            <div class="flex flex-col min-w-0 flex-1">
                                                <span class="font-semibold truncate max-w-[90%] font-mono text-sm" title="${path}">${path}</span>
                                                <div class="flex items-center">
                                                    <span class="text-xs text-gray-400 truncate max-w-[90%]" title="${item.name}">${item.name}</span>
                                                    <span class="ml-2 px-2 py-0.5 text-xs rounded-full ${statusClass}">${item.status || 'ready'}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <span class="material-icons transition-transform duration-150 flex-shrink-0" id="endpoint-icon-${catIndex}-${endpointIndex}">expand_more</span>
                                    </button>

                                    <div id="endpoint-${catIndex}-${endpointIndex}" class="hidden bg-gray-800 p-4 border-t border-gray-700">
                                        <div class="mb-3">
                                            <div class="text-gray-400 text-xs">${item.desc}</div>
                                        </div>
                                        `;
                    if (item.status === 'ready') {
                        const isYoutubeDownloader = path === '/download/youtube';
                        html += `
                                            <div>
                                                <div class="text-gray-300 font-bold text-xs mb-2 flex items-center">
                                                    <span class="material-icons text-sm mr-1">play_arrow</span>
                                                    TRY IT OUT
                                                </div>
                                                <div>`;

                        if (isYoutubeDownloader) {
                            html += `
                                                    <form id="form-${catIndex}-${endpointIndex}" onsubmit="executeRequest(event, ${catIndex}, ${endpointIndex}, '${method}', '${path}', 'application/json')">
                                                        <div class="mb-4 space-y-2">
                                                            <div>
                                                                <label class="block text-xs font-medium text-slate-400 mb-2">url <span class="text-red-500">*</span></label>
                                                                <input type="text" name="url" class="w-full px-3 py-2 border border-gray-600 text-sm focus:outline-none focus:border-indigo-500 bg-gray-700 placeholder:text-slate-500" placeholder="URL video YouTube." required>
                                                            </div>
                                                            <div>
                                                                <label class="block text-xs font-medium text-slate-400 mb-2">type</label>
                                                                <select name="type" id="yt-type-${catIndex}-${endpointIndex}" onchange="updateYoutubeQualityOptions(${catIndex}, ${endpointIndex})" class="w-full px-3 py-2 border border-gray-600 text-sm focus:outline-none focus:border-indigo-500 bg-gray-700">
                                                                    <option value="video">video</option>
                                                                    <option value="audio">audio</option>
                                                                </select>
                                                            </div>
                                                            <div>
                                                                <label class="block text-xs font-medium text-slate-400 mb-2">quality</label>
                                                                <select name="quality" id="yt-quality-${catIndex}-${endpointIndex}" class="w-full px-3 py-2 border border-gray-600 text-sm focus:outline-none focus:border-indigo-500 bg-gray-700">
                                                                    <option value="1080P">1080P</option>
                                                                    <option value="720P" selected>720P</option>
                                                                    <option value="480P">480P</option>
                                                                    <option value="360P">360P</option>
                                                                    <option value="240P">240P</option>
                                                                    <option value="144P">144P</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 font-semibold text-white px-6 py-2 text-xs font-medium transition-colors duration-150">
                                                            Execute
                                                        </button>
                                                        <button type="button" id="clear-${catIndex}-${endpointIndex}" onclick="clearResponse(${catIndex}, ${endpointIndex})" class="hidden bg-gray-700 border border-gray-600 hover:border-gray-500 font-semibold text-slate-300 px-6 py-2 text-xs font-medium transition-colors duration-150 ml-2">
                                                            Clear
                                                        </button>
                                                    </form>`;
                        } else {
                            html += `
                                                    <form id="form-${catIndex}-${endpointIndex}" onsubmit="executeRequest(event, ${catIndex}, ${endpointIndex}, '${method}', '${path}', 'application/json')">
                                                        <div class="mb-4 space-y-2">`;
                            if (item.params) {
                                Object.keys(item.params).forEach(paramName => {
                                    const isRequired = !queryParams.has(paramName) || queryParams.get(paramName) === '';
                                     html += `<div>
                                                <label class="block text-xs font-medium text-slate-400 mb-2">${paramName} ${isRequired ? '<span class="text-red-500">*</span>' : ''}</label>
                                                <input type="text" name="${paramName}" class="w-full px-3 py-2 border border-gray-600 text-sm focus:outline-none focus:border-indigo-500 bg-gray-700 placeholder:text-slate-500" placeholder="${item.params[paramName]}" ${isRequired ? 'required' : ''}>
                                              </div>`;
                                });
                            }
                            html += `
                                                        </div>
                                                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 font-semibold text-white px-6 py-2 text-xs font-medium transition-colors duration-150">
                                                            Execute
                                                        </button>
                                                        <button type="button" id="clear-${catIndex}-${endpointIndex}" onclick="clearResponse(${catIndex}, ${endpointIndex})" class="hidden bg-gray-700 border border-gray-600 hover:border-gray-500 font-semibold text-slate-300 px-6 py-2 text-xs font-medium transition-colors duration-150 ml-2">
                                                            Clear
                                                        </button>
                                                    </form>`;
                        }

                        html += `
                                                </div>
                                            </div>`;
                    } else {
                        html += `<div class="text-yellow-400 text-xs p-3 bg-yellow-500/20 border border-yellow-500/30">Endpoint ini tidak dapat diuji coba saat ini.</div>`;
                    }

                    html += `
                                        <div id="response-${catIndex}-${endpointIndex}" class="hidden mt-4">
                                            <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
                                                <div class="text-gray-300 font-bold text-xs flex items-center">
                                                    <span class="material-icons text-sm mr-1">code</span>
                                                    RESPONSE
                                                </div>
                                                <span class="text-xs font-semibold text-slate-400 bg-gray-800 border border-gray-700 px-2 py-1 flex items-center gap-1">
                                                    <span class="material-icons" style="font-size:12px;">bolt</span>
                                                    <span id="response-time-value-${catIndex}-${endpointIndex}"></span>
                                                </span>
                                            </div>

                                            <div class="bg-gray-800 border border-gray-700 p-3 mb-2 text-xs space-y-3">
                                                <div>
                                                    <span class="text-slate-400 font-semibold block mb-1">Response Status</span>
                                                    <table class="w-full border border-gray-700 border-collapse">
                                                        <thead>
                                                            <tr class="bg-gray-900 text-slate-400">
                                                                <th class="px-2 py-1 border border-gray-700 text-left" style="width:70px;">Code</th>
                                                                <th class="px-2 py-1 border border-gray-700 text-left">Description</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            <tr>
                                                                <td id="response-status-code-${catIndex}-${endpointIndex}" class="px-2 py-1 border border-gray-700 font-bold bg-gray-900"></td>
                                                                <td id="response-status-desc-${catIndex}-${endpointIndex}" class="px-2 py-1 border border-gray-700 bg-gray-900"></td>
                                                            </tr>
                                                        </tbody>
                                                    </table>
                                                </div>
                                                <div>
                                                    <div class="flex items-center justify-between mb-1">
                                                        <span class="text-slate-400 font-semibold">Request URL</span>
                                                        <button type="button" onclick="copyText('response-url-${catIndex}-${endpointIndex}', this)" class="text-xs px-2 py-1 border border-gray-600 hover:border-indigo-500 text-slate-300 transition-colors duration-150">Copy URL</button>
                                                    </div>
                                                    <code id="response-url-${catIndex}-${endpointIndex}" class="block break-all bg-gray-900 border border-gray-700 p-2 text-indigo-300"></code>
                                                </div>
                                                <div>
                                                    <div class="flex items-center justify-between mb-1">
                                                        <span class="text-slate-400 font-semibold">cURL Command</span>
                                                        <button type="button" onclick="copyText('response-curl-${catIndex}-${endpointIndex}', this)" class="text-xs px-2 py-1 border border-gray-600 hover:border-indigo-500 text-slate-300 transition-colors duration-150">Copy cURL</button>
                                                    </div>
                                                    <code id="response-curl-${catIndex}-${endpointIndex}" class="block break-all bg-gray-900 border border-gray-700 p-2 text-slate-300"></code>
                                                </div>
                                            </div>

                                            <div class="flex items-center justify-end gap-2 mb-2">
                                                <button type="button" id="download-btn-${catIndex}-${endpointIndex}" onclick="downloadResponse(${catIndex}, ${endpointIndex})" class="hidden text-xs px-3 py-1 border border-gray-600 hover:border-indigo-500 text-slate-300 transition-colors duration-150 flex items-center gap-1">
                                                    <span class="material-icons" style="font-size:14px;">download</span> Download
                                                </button>
                                                <button type="button" id="copy-response-btn-${catIndex}-${endpointIndex}" onclick="copyText('response-content-${catIndex}-${endpointIndex}', this)" class="hidden text-xs px-3 py-1 border border-gray-600 hover:border-indigo-500 text-slate-300 transition-colors duration-150">Copy Response</button>
                                            </div>

                                            <div class="bg-gray-900 text-white text-xs p-4 border border-gray-700">
                                                <div class="max-h-80 overflow-auto" id="response-content-${catIndex}-${endpointIndex}"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>`;
                });
                html += `</div></div></div>`;
            });
            apiList.innerHTML = html;
        } catch (error) {
            apiList.innerHTML = '<p class="text-red-500">Failed to load API data.</p>';
            console.error('Error loading API data:', error);
        }
    }

    async function loadNotifications() {
        const notificationsList = document.getElementById('notifications-list');
        const unreadCountBadge = document.getElementById('unread-count');
        try {
            const response = await fetch('/notifications.json');
            const notifications = await response.json();

            notificationsList.innerHTML = '';
            let unreadCount = 0;

            notifications.sort((a, b) => new Date(b.date) - new Date(a.date));

            notifications.forEach(notif => {
                if (!notif.read) {
                    unreadCount++;
                }
                const notifElement = document.createElement('div');
                notifElement.className = `bg-gray-800 border border-gray-700 p-4 text-xs ${notif.read ? 'opacity-60' : ''}`;
                notifElement.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <p class="font-bold text-slate-300 mb-1">${notif.title}</p>
                            <p class="text-slate-400">${notif.message}</p>
                        </div>
                        <div class="flex items-center ml-4 flex-shrink-0">
                            ${!notif.read ? '<div class="w-2 h-2 bg-green-400 rounded-full mr-2" title="Unread"></div>' : ''}
                            <span class="text-slate-500">${new Date(notif.date).toLocaleDateString('id-ID', { year: 'numeric', month: 'short', day: 'numeric' })}</span>
                        </div>
                    </div>
                `;
                notificationsList.appendChild(notifElement);
            });

            if (unreadCount > 0) {
                unreadCountBadge.textContent = `${unreadCount} Belum dibaca`;
                unreadCountBadge.classList.remove('hidden');
            }

        } catch (error) {
            notificationsList.innerHTML = '<p class="text-red-500 text-xs">Gagal memuat notifikasi.</p>';
            console.error('Error loading notifications:', error);
        }
    }

    document.getElementById('searchInput').addEventListener('input', function() {
        const searchTerm = this.value.toLowerCase();
        const apiItems = document.querySelectorAll('.api-item');
        const categories = document.querySelectorAll('.category-group');
        const noResults = document.getElementById('noResults');
        let visibleCount = 0;

        apiItems.forEach(item => {
            const path = item.dataset.path.toLowerCase();
            const alias = item.dataset.alias.toLowerCase();
            const description = item.dataset.description.toLowerCase();

            if (path.includes(searchTerm) || alias.includes(searchTerm) || description.includes(searchTerm)) {
                item.style.display = '';
                visibleCount++;
            } else {
                item.style.display = 'none';
            }
        });

        categories.forEach(category => {
            const visibleItems = category.querySelectorAll('.api-item[style=""]');
            if (visibleItems.length > 0) {
                category.style.display = '';
            } else {
                category.style.display = 'none';
            }
        });

        if (visibleCount === 0) {
            noResults.style.display = 'block';
        } else {
            noResults.style.display = 'none';
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        loadApis();
        loadNotifications();
    });
</script>

</body>
</html>
